name: 'CD: NPM publish with tag push'

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse on the selected ref'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  inspect:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      dist-tag: ${{ steps.metadata.outputs.distTag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0

      - name: Verify release tag is on master
        if: github.event_name == 'push'
        id: source
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/master
          git cat-file -e HEAD:CHANGELOG.md
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata and registry state
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/release-metadata.mjs --check-npm

  verify:
    needs: inspect
    permissions:
      contents: read
    uses: ./.github/workflows/ci-test.yml
    with:
      release-version: ${{ needs.inspect.outputs.version }}

  publish:
    if: github.event_name == 'push' && github.repository == 'lotivo/sequelize-guard'
    needs: [inspect, verify]
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      id-token: write

    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0 # Includes npm 11.12.1 with trusted publishing support.
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sequelize-guard-package
          path: ${{ runner.temp }}/package/

      - name: Publish the verified candidate to npm
        working-directory: ${{ runner.temp }}/package
        env:
          NPM_DIST_TAG: ${{ needs.inspect.outputs.dist-tag }}
        run: |
          sha256sum -c SHA256SUMS
          flags=(--provenance --access public --ignore-scripts)
          # An implicit latest tag preserves npm's guard against replacing a newer stable release.
          if [[ "$NPM_DIST_TAG" == 'next' ]]; then
            flags+=(--tag next)
          fi
          npm publish ./sequelize-guard.tgz "${flags[@]}"

  draft-github-release:
    needs: [inspect, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.inspect.outputs.prerelease }}
          SOURCE_SHA: ${{ needs.inspect.outputs.source-sha }}
        run: |
          flags=(--verify-tag --draft --generate-notes)
          if [[ "$PRERELEASE" == 'true' ]]; then
            flags+=(--prerelease --latest=false)
          fi
          changelog="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$SOURCE_SHA/CHANGELOG.md"
          gh release create "$RELEASE_TAG" "${flags[@]}" --title "Release $RELEASE_TAG" --notes "[Changelog]($changelog)"
