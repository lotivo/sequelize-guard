name: 'CD: NPM publish with tag push'

on:
  push:
    tags:
      - 'v*' # Triggers only on tags starting with 'v' (e.g. v1.0.0, v2.1.3)

jobs:
  release:
    name: 'Publish on NPM'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # Required to create the GitHub Release
      id-token: write # Required for npm trusted publishing via OIDC

    strategy:
      matrix:
        # "node_js: - stable" logic (Node 24 is current LTS/stable)
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn' # Automatic caching for Yarn

      - name: Enable pinned Yarn version
        run: corepack enable

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        # This runs lint with eslint
        run: yarn lint

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Check library types
        run: yarn typecheck

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          base-path: packages/sequelize-guard

      - name: Build the library
        run: yarn build

      - name: Set Version from Tag
        id: stage_version
        working-directory: ./build/packages/sequelize-guard
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version -- "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Test release package consumers
        env:
          RELEASE_VERSION: ${{ steps.stage_version.outputs.version }}
        run: node --test scripts/test-package.mjs

      - name: Publish to NPM
        working-directory: ./build/packages/sequelize-guard
        run: |
          if [[ "${{ github.ref_name }}" == *"-"* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      - name: Upload NPM Debug Log on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # This name is what the file will be called when you download it
          name: npm-debug-log
          # Specify the exact path where npm saves its log on the runner
          path: /home/runner/.npm/_logs/*debug-*.log
          # Ignore the step if the file is not found (e.g., if the failure was not an npm error)
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Uses the tag name for the release title
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
