name: 'Update API Documentation'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag'
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  generate:
    if: >-
      github.repository == 'lotivo/sequelize-guard' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      changed: ${{ steps.patch.outputs.changed }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0

      - name: Verify published release and check out its source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          release_ref="refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet -- "$release_ref"
          git merge-base --is-ancestor "$release_ref" HEAD
          gh release view --json isDraft,isPrerelease -- "$RELEASE_TAG" | jq -e '(.isDraft == false) and (.isPrerelease == false)'
          git checkout --detach "$release_ref"

      - name: Verify npm latest matches the release
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          node scripts/release-metadata.mjs
          [[ "$(npm view sequelize-guard dist-tags.latest --prefer-online)" == "${RELEASE_TAG#v}" ]]

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: corepack yarn install --frozen-lockfile

      - run: node scripts/generate-api-docs.mjs

      - name: Prepare the API documentation patch
        id: patch
        run: |
          api_dir=apps/sequelize-guard-docs/content/docs/api
          git add -A -- "$api_dir"
          git diff --cached --binary -- "$api_dir" > "$RUNNER_TEMP/docs.patch"
          if [[ -s "$RUNNER_TEMP/docs.patch" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated changes
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs-patch
          path: ${{ runner.temp }}/docs.patch
          if-no-files-found: error
          overwrite: true

  open-pull-request:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: master
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-docs-patch
          path: ${{ runner.temp }}

      - name: Apply the generated changes
        run: git apply --include='apps/sequelize-guard-docs/content/docs/api/**' "$RUNNER_TEMP/docs.patch"

      - name: Create or update the documentation pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          add-paths: apps/sequelize-guard-docs/content/docs/api/
          base: master
          branch: docs/update-api-v${{ needs.generate.outputs.version }}
          title: 'docs: Update API documentation for v${{ needs.generate.outputs.version }}'
          commit-message: 'docs: Update API documentation for v${{ needs.generate.outputs.version }}'
          body: 'API documentation generated from the v${{ needs.generate.outputs.version }} release.'
