name: 'CI: packed consumers'

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn
      - run: corepack yarn install --frozen-lockfile
      - run: corepack yarn build
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NX_ISOLATE_PLUGINS: 'false'
      - run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack build/packages/sequelize-guard --ignore-scripts --json --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v7
        with:
          name: sequelize-guard-packed
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  consumers:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.17.1, 24.15.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v4
        with:
          name: sequelize-guard-packed
          path: ${{ runner.temp }}/package
      - name: Test the exact shared archive
        run: |
          archive=( "$RUNNER_TEMP/package"/*.tgz )
          RELEASE_TARBALL="${archive[0]}" node --test scripts/test-package.mjs
