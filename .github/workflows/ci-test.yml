name: 'CI: test & build'

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, dev]
  workflow_call:
    inputs:
      release-version:
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HUSKY: '0'
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  NX_ISOLATE_PLUGINS: 'false'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.17.1, 24.15.0]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack yarn install --frozen-lockfile

      - name: Generate API reference for validation
        run: corepack yarn docs:generate

      - name: Check workflow metadata
        run: |
          node --test scripts/release-metadata.test.mjs scripts/test-ai-guidance.mjs
          node scripts/check-docs.mjs

      - run: corepack yarn lint
      - run: corepack yarn typecheck
      - run: corepack yarn test:coverage
      - run: corepack yarn build

      - name: Check and build the documentation site
        run: |
          corepack yarn workspace sequelize-guard-docs lint
          corepack yarn workspace sequelize-guard-docs build
          (cd apps/sequelize-guard-docs && exec node ../../node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3197) > "$RUNNER_TEMP/guard-docs.log" 2>&1 &
          docs_pid=$!
          trap 'kill "$docs_pid"' EXIT
          kill -0 "$docs_pid"
          DOCS_BASE_URL=http://127.0.0.1:3197 node --test scripts/test-ai-guidance.mjs
          kill -0 "$docs_pid"

      - name: Report coverage
        if: matrix.node-version == '24.15.0' && inputs.release-version == ''
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          base-path: packages/sequelize-guard
          coverage-reporter-version: v0.6.22

      - name: Pack the candidate
        if: matrix.node-version == '24.15.0'
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          release_dir="$RUNNER_TEMP/package"
          build_dir="./build/packages/sequelize-guard"
          mkdir -p "$release_dir"

          if [[ -n "$RELEASE_VERSION" ]]; then
            (cd "$build_dir" && npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts)
          fi

          npm pack "$build_dir" --ignore-scripts --json --pack-destination "$release_dir" | tee "$RUNNER_TEMP/pack.json"
          filename=$(jq -er '.[0].filename' "$RUNNER_TEMP/pack.json")
          mv "$release_dir/$filename" "$release_dir/sequelize-guard.tgz"
          (cd "$release_dir" && sha256sum sequelize-guard.tgz | tee SHA256SUMS)

      - name: Upload the candidate
        if: matrix.node-version == '24.15.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sequelize-guard-package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          overwrite: true

  packed-consumers:
    needs: build-and-test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.17.1, 24.15.0]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sequelize-guard-package
          path: ${{ runner.temp }}/package/

      - name: Verify and test the candidate
        env:
          RELEASE_TARBALL: ${{ runner.temp }}/package/sequelize-guard.tgz
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          (cd "$RUNNER_TEMP/package" && sha256sum -c SHA256SUMS)
          node --test scripts/test-package.mjs

  database:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.17.1, 24.15.0]
        dialect: [postgres, mysql]

    services:
      postgres:
        image: ${{ matrix.dialect == 'postgres' && 'postgres:17' || '' }}
        env:
          POSTGRES_DB: guard_test
          POSTGRES_PASSWORD: guard-test
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d guard_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
        ports: ['5432/tcp']
      mysql:
        image: ${{ matrix.dialect == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: guard_test
          MYSQL_ROOT_PASSWORD: guard-test
          MYSQL_ROOT_HOST: '%'
        options: >-
          --health-cmd "mysql -h 127.0.0.1 -uroot -pguard-test -e 'SELECT 1' guard_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
        ports: ['3306/tcp']

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack yarn install --frozen-lockfile

      - name: Test schema installation and upgrade
        env:
          SEQUELIZE_GUARD_TEST_DATABASE_URL: >-
            ${{ matrix.dialect == 'postgres'
                && format('postgresql://postgres:guard-test@127.0.0.1:{0}/guard_test', job.services.postgres.ports['5432'])
                || format('mysql://root:guard-test@127.0.0.1:{0}/guard_test', job.services.mysql.ports['3306']) }}
        run: ./node_modules/.bin/vitest run --config packages/sequelize-guard/vitest.dialects.config.mts dialect.integration.ts holder-dialects.integration.ts

      - name: Verify authorization against a lagging physical standby
        if: matrix.dialect == 'postgres'
        run: bash scripts/test-guard-replication.sh
